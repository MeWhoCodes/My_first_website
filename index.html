<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    
   
    
    <style>
      body {
        font-family: 'Times New Roman', Times, serif;
        text-align: center;
        margin-top: 20%;
        background-color: #f4f4f4;
      }
  
    </style>
  </head>
  
  <body>

      <h1>Redirecting</h1>
      <p>Redirecting you in <b id="countdown">5</b> seconds...</p>
  

    <script type="text/javascript">
      // 1. Destination URL
      var destination = "https://forms.gle/ZXSmeGH9NDxFuLKj8";

      // 2. JavaScript Delay (5000 milliseconds = 5 seconds)
      setTimeout(function() {
        window.location.replace(destination);
      }, 5000);

      // 3. Optional: Visual Countdown Timer
      var seconds = 5;
      setInterval(function() {
        seconds--;
        if (seconds >= 0) {
          document.getElementById("countdown").textContent = seconds;
        }
      }, 1000);
    </script>

  </body>

</html>
