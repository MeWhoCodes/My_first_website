<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <meta http-equiv="refresh" content="5; url=https://forms.gle/ZXSmeGH9NDxFuLKj8">

  <style>
    body {
      background-color: #faebd7; /* Antique White */
      color: black;
      font-family: 'Press Start 2P', cursive;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    #timer-text {
      font-size: 0.8rem;
      margin-bottom: 50px; /* Extra space for the cat on top of bar */
    }

    /* THE BAR CONTAINER */
    .progress-container {
      width: 300px;
      max-width: 80%;
      height: 30px; /* Height of the bar */
      border: 4px solid black;
      position: relative; /* Needed for positioning the cat */
      background: white;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
    }

    /* THE FILL ANIMATION */
    .progress-fill {
      height: 100%;
      background-color: black;
      width: 0%;
      animation: fillBar 5s linear forwards;
    }

    /* THE CAT GIF POSITIONING */
    .cat-gif {
      position: absolute;
      /* This puts the cat in the horizontal CENTER of the bar */
      left: 50%;
      transform: translateX(-50%);
      
      /* Adjust this to move the cat UP so it sits ON the bar */
      /* Since the GIF size varies, you might need to tweak this number */
      bottom: 35; 
      
      width: 60px; /* Size of the cat */
      height: auto;
      image-rendering: pixelated; /* Keeps the GIF sharp */
      z-index: 10;
    }

    @keyframes fillBar {
      from { width: 0%; }
      to { width: 100%; }
    }

    a { color: black; text-decoration: none; border-bottom: 2px solid black; }
  </style>
</head>

<body>

  <h1>Redirecting...</h1>
  
  <div id="timer-text">Redirecting in <span id="countdown">5</span> seconds</div>

  <div class="progress-container">
    
    <img 
      src="https://media.tenor.com/RyF8iVDEf3cAAAAj/16bit-80s.gif" 
      alt="Walking Cat" 
      class="cat-gif"
    >
    
    <div class="progress-fill"></div>
  </div>
  
  <p style="margin-top: 40px; font-size: 0.6rem;">
    <a href="https://forms.gle/ZXSmeGH9NDxFuLKj8">[ SKIP ]</a>
  </p>

  <script>
    var destination = "https://forms.gle/ZXSmeGH9NDxFuLKj8";

    setTimeout(function() {
      window.location.replace(destination);
    }, 5000);

    var seconds = 5;
    setInterval(function() {
      seconds--;
      if (seconds >= 0) {
        document.getElementById("countdown").textContent = seconds;
      }
    }, 1000);
  </script>

</body>
</html>
