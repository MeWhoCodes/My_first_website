<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <meta http-equiv="refresh" content="5; url=https://YOUR-NEW-WEBSITE.com">
    
    <style>
      body {
        /* 2. APPLY THE FONT HERE */
        font-family: 'Press Start 2P', cursive;
        
        text-align: center;
        margin-top: 20%;
        background-color: #202020; /* Dark background matches pixel fonts better */
        color: #00ff00;            /* Bright green text for that "Terminal" look */
      }
      .container {
        padding: 20px;
        display: inline-block;
      }
      a {
        color: #ffffff; /* White links */
      }
    </style>
  </head>
  
  <body>
    <div class="container">
      <h2 style="font-size: 1.5em; line-height: 1.5;">WARPING...</h2>
      
      <p style="font-size: 0.8em; margin-top: 20px;">
        NEW ZONE LOADING IN <br>
        <span id="countdown" style="font-size: 2em;">5</span>
      </p>
      
      <p style="font-size: 0.6em; margin-top: 30px;">
        <a href="https://YOUR-NEW-WEBSITE.com">[ SKIP INTRO ]</a>
      </p>
    </div>

    <script type="text/javascript">
      var destination = "https://YOUR-NEW-WEBSITE.com";
      
      setTimeout(function() {
        window.location.replace(destination);
      }, 5000);

      var seconds = 5;
      setInterval(function() {
        seconds--;
        if (seconds >= 0) {
          document.getElementById("countdown").textContent = seconds;
        }
      }, 1000);
    </script>
  </body>
</html>
