<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    
   <meta http-equiv="refresh" content="5; url=https://YOUR-NEW-WEBSITE.com">
    
    <style>
      body {
        font-family: sans-serif;
        text-align: center;
        margin-top: 20%;
        background-color: #f4f4f4;
      }
      .container {
        background: antiquewhite;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        display: inline-block;
      }
    </style>
  </head>
  
  <body>
    <div class="container">
      <h2>Redirecting/h2>
      <p>Redirecting you in<b id="countdown">5</b> seconds...</p>
      
      <p><small>If nothing happens, <a href="https://forms.gle/ZXSmeGH9NDxFuLKj8">click here</a>.</small></p>
    </div>

    <script type="text/javascript">
      // 1. Destination URL
      var destination = "https://forms.gle/ZXSmeGH9NDxFuLKj8";

      // 2. JavaScript Delay (5000 milliseconds = 5 seconds)
      setTimeout(function() {
        window.location.replace(destination);
      }, 5000);

      // 3. Optional: Visual Countdown Timer
      var seconds = 5;
      setInterval(function() {
        seconds--;
        if (seconds >= 0) {
          document.getElementById("countdown").textContent = seconds;
        }
      }, 1000);
    </script>

  </body>

</html>
