<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <meta http-equiv="refresh" content="5; url=forms.gle/ZXSmeGH9NDxFuLKj8">

  <style>
    body {
      background-color: #faebd7; /* Antique White */
      color: black;
      font-family: 'Press Start 2P', cursive;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    #timer-text {
      font-size: 0.8rem;
      margin-bottom: 60px; /* Space for the cat */
    }

    /* THE BAR CONTAINER */
    .progress-container {
      width: 300px;
      max-width: 80%;
      height: 30px;
      border: 4px solid black;
      position: relative;
      background: white;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
    }

    /* THE FILL ANIMATION */
    .progress-fill {
      height: 100%;
      background-color: black;
      width: 0%;
      animation: fillBar 5s linear forwards;
    }

    /* THE CAT CONTAINER (Positions the cat on the bar) */
    .cat-wrapper {
      position: absolute;
      /* This puts the cat's container exactly at the top edge of the bar */
      bottom: 30px; 
      /* Centers it horizontally */
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    /* THE CAT (Drawn with pure CSS code - No Image Link Needed) */
    .cat {
      width: 4px; 
      height: 4px;
      color: black;
      /* The bounce animation makes it look like it's walking */
      animation: walkBounce 0.4s infinite alternate;
      
      /* THIS IS THE PIXEL ART MAP */
      box-shadow: 
        /* Body */
        12px 0, 16px 0, 
        8px 4px, 12px 4px, 16px 4px, 20px 4px,
        4px 8px, 8px 8px, 12px 8px, 16px 8px, 20px 8px, 24px 8px,
        4px 12px, 8px 12px, 12px 12px, 16px 12px, 20px 12px, 24px 12px,
        /* Legs */
        4px 16px, 8px 16px, 20px 16px, 24px 16px,
        /* Head */
        24px 0, 28px 4px, 24px 4px, 28px 8px,
        /* Tail */
        0px 4px, 0px 8px; 
    }

    /* WATERMARK */
    .watermark {
      position: fixed;
      bottom: 15px;
      right: 15px;
      font-size: 0.5rem;
      opacity: 0.6;
    }

    /* ANIMATIONS */
    @keyframes fillBar {
      from { width: 0%; }
      to { width: 100%; }
    }

    @keyframes walkBounce {
      from { transform: translateY(0); }
      to { transform: translateY(-4px); }
    }

    a { color: black; text-decoration: none; border-bottom: 2px solid black; }
  </style>
</head>

<body>

  <h1>Redirecting...</h1>
  
  <div id="timer-text">Redirecting in <span id="countdown">5</span> seconds</div>

  <div class="progress-container">
    <div class="cat-wrapper">
      <div class="cat"></div>
    </div>
    
    <div class="progress-fill"></div>
  </div>
  
  <p style="margin-top: 40px; font-size: 0.6rem;">
    <a href="forms.gle/ZXSmeGH9NDxFuLKj8">[ SKIP ]</a>
  </p>

  <div class="watermark">a D-Originals</div>

  <script>
    var destination = "forms.gle/ZXSmeGH9NDxFuLKj8";

    setTimeout(function() {
      window.location.replace(destination);
    }, 5000);

    var seconds = 5;
    setInterval(function() {
      seconds--;
      if (seconds >= 0) {
        document.getElementById("countdown").textContent = seconds;
      }
    }, 1000);
  </script>

</body>
</html>
